<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sawsan & Hassan</title>
  
  <!-- Font Styles -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Great+Vibes&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Background Music Audio -->
  <audio id="bg-music" loop preload="auto">
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <!-- Envelope Video Container -->
  <div class="envelope-wrapper">
    <video id="envelope-video" autoplay muted playsinline>
      <source src="envelope-video.mp4" type="video/mp4">
    </video>

    <!-- Overlay Card (Fits and blends into envelope texture, no white box) -->
    <div id="card-overlay" class="card-overlay">
      <div class="card-content">
        
        <!-- Top Line Accent & Geometric Symbol -->
        <div class="line-divider">
          <span class="line"></span>
          <span class="symbol">&#10043;</span>
          <span class="line"></span>
        </div>

        <!-- Olive Green Names Typography -->
        <h1 class="names-text">Sawsan & Hassan</h1>

        <!-- Bottom Line Accent & Geometric Symbol -->
        <div class="line-divider">
          <span class="line"></span>
          <span class="symbol">&#10048;</span>
          <span class="line"></span>
        </div>

      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
